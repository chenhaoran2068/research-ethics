      research-category.route-leaf: investigator-observational
    compared_options:
      'yes':
        added_field_paths:
          - research-design.diagnostic-gold-standard
          - research-design.diagnostic-index-test
          - research-design.diagnostic-target-condition
          - research-design.diagnostic-target-sample-size
          - research-design.diagnostic-confusable-population
          - research-design.diagnostic-confusable-sample-size
      'no':
        added_field_paths:
          - research-design.group-name
          - research-design.group-sample-size
          - research-design.control-group-flag
          - research-design.intervention-name
          - research-design.joint-measures
          - research-design.intervention-description
    current_page_comparison: Diagnostic-test yes displayed the six diagnostic-specific controls and did not display the normal research-group/intervention controls. Diagnostic-test no displayed the observed normal group/intervention controls and no diagnostic.* controls. The two routes are a confirmed research-design structural branch and must not be merged.
    boundary: This matched-viewport comparison does not prove complete later-page equivalence, repeat-item behavior, or public-policy English variants.
