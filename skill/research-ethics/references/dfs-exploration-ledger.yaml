# De-identified DFS evidence ledger for the v1 researcher-initiated scope.
# It is evidence only; registration-tree.yaml remains the sole form-rule source.
ledger_schema_version: '1.0'
canonical:
  path: references/registration-tree.yaml
  sha256: sha256:192baa4db55fd7d7c2f25f5e62c32b6850aa6e370985bac0a23ccb1a56b97b52
scope:
  version: v1
  supported_root_routes:
    - investigator-observational
  deferred_to_v2_root_routes:
    - investigator-interventional
    - product-drug
    - product-medical-device
    - product-ivd
    - product-special-food
evidence_grades:
  current_page_verified: The compared options were directly observed on their own page; later pages are not implied.
  downstream_spot_checked: A representative route with this current-page state was checked on later key pages.
  reused_downstream_structure: The final display copies a representative later structure below this branch; it is not an independent leaf replay.
  full_leaf_replay: A root-to-last-reachable-page replay; this remains stronger evidence when available.
  high_risk_deeper_check_required: A current-page result cannot be reused until a deeper representative check covers downstream high-risk pages.
verification_levels:
  fully_live_verified: A full root-to-last-reachable-page replay was performed under the recorded selections.
  sample_verified: A declared, representative live sample was checked within its stated page and condition scope; it does not imply every downstream combination was replayed.
  assumption_expanded: A current-page delta is retained and the later display template is copied under the declared V1.0 locality assumption; it is not a full replay claim.
  inferred_from_initial_tree: Present in the initial rule model but not yet supported by this round's declared live sample.
  mismatch_found: A live sample differed from the initial rule model; run local DFS below the divergent condition before relying on it.
  out_of_scope_or_blocked: A known branch cannot be completed in the current authorization or runtime environment and is excluded from supported V1 generation.
  deferred_to_v2: Explicitly excluded product-registration route; not covered by V1.
runtime_limitations:
  - status: control_session_unavailable
    scope: in_app_browser_attachment_after_handoff
  - status: tab_navigation_not_reliably_effective
    scope: one recovered unsaved researcher-initiated draft
    observed_behavior: Supported normal-UI clicks on tab1 and tab7 returned successfully but the visible field signature remained the research-design signature; no platform field conclusion was drawn.
    mitigation: Use a fresh unsaved draft and root-path replay or the platform next-step controls for subsequent cross-page samples; do not infer a page is visited from a successful click response.
    detail: After the temporary data-sharing subroute was handed off, the browser-control runtime no longer exposed the existing in-app research tab and its JavaScript control kernel returned a parser error during reattachment attempts.
    consequence: No subsequent UI action was taken. This is a recoverable control-channel limitation, not a platform finding and not a reason to mark any remaining V1 branch verified, mismatched, or inaccessible.
  - status: user_paused
    scope: fresh_unsaved_data_sharing_result_release_method_other_subroute
    detail: The current normal-UI comparison of the result-release-method other option was intentionally stopped at the user's request before a stable option-state/difference record was retained.
    consequence: Mark this subroute out_of_scope_or_blocked for the current pass. Preserve previously recorded canonical visibility/non-requiredness evidence, but do not claim a new live comparison or attempt to finish this subroute in the current pass.
  - status: observed
    scope: fresh_isolated_unsaved_research_content_draft
    detail: The DOM-visible control list included the extra-measure-name input before the styled extra-inspection radio exposed a readable checked state. One normal click plus Space on the visible false radio did not change the list.
    consequence: This is ambiguous between a platform default and a visibility-model difference. It is not a mismatch finding and must not change the canonical condition until a reliable yes/no comparison is captured.
  - status: observed
    scope: fresh_isolated_unsaved_research_category_draft
    detail: A fresh draft confirmed that normal UI cascading selectors can switch from the root classification to the researcher-initiated and observational route. The visible styled diagnostic-test radio accepted a normal DOM-visible click but exposed no changed checked state or changed visible structure afterward.
    consequence: Classification-selector evidence can be collected in a fresh draft. The diagnostic radio attempt is not counted as a new comparison and must not override the prior recorded diagnostic yes/no observation.
  - status: observed
    scope: current_unsaved_research_design_draft
    detail: Supported normal-UI clicks on the styled vulnerable-group radio, its rendered label, an adjacent page tab, and an inclusion-repeat delete action did not change the platform's checked state, visible page, or repeat count.
    consequence: These attempted changes are not counted as branch or repeat-behavior verification. Read-only visible-field observations remain partial evidence only.
  - status: observed
    scope: current_unsaved_interventional_research_design_draft
    detail: The normal UI radio for random-group could be selected and its checked state confirmed. The browser surface then failed while operating the visible native random-method select, before a selected method could be confirmed.
    consequence: Random-group yes/no remains current-page evidence; random-method, blinding, allocation-concealment, and unblinding subbranches remain pending rather than inferred from this attempt.
  - status: observed
    scope: current_unsaved_interventional_draft
    detail: A visible normal-UI click on the implementation-information tab did not change the active visible pane away from research-design in this browser surface.
    consequence: No multicenter child-condition result was recorded from this attempt. Existing multicenter current-page comparison evidence remains unchanged; deeper child conditions remain pending.
  - status: observed
    scope: current_unsaved_interventional_draft
    detail: The visible research-category navigation link was clicked after a direct reset to hash tab0. The URL retained hash tab0, but the only rendered active pane remained research-design.
    consequence: This browser session cannot provide a reliable root-path replay for the interventional route. It does not alter existing current-page observations, and it must not be used to infer interventional downstream equivalence.
  - status: observed
    scope: fresh_unsaved_interventional_unproduct_draft
    detail: A new isolated draft reached the visible unmarketed-product-type native select. Standard browser selection was unavailable in this runtime, and one normal keyboard attempt through the rendered chooser left its value unchanged.
    consequence: The product-type other downstream spot check is not established. No subsequent option-changing retries were performed, and the existing other-type current-page mismatch remains unresolved.
  - status: observed
    scope: current_unsaved_interventional_draft_related_attachments_tab
    detail: Directly opening the related-attachments tab rendered only navigation and terminal actions, with no attachment control, format, or requiredness metadata visible.
    consequence: This is not evidence that no attachments are required. Attachment details remain out of the current unsaved-draft verification surface and must retain their existing evidence grade.
  - status: observed
    scope: fresh_unsaved_interventional_research_design_draft
    detail: After a normal scroll, the browser's rendered node identifiers no longer reliably matched the visible random-group controls; a subsequent normal click changed the visible pane to research-content instead of producing a confirmed random-group selection.
    consequence: This attempt is excluded from evidence. Subsequent randomization sampling must use a fresh stable viewport and newly captured locators; no rule or verification level is changed by it.
  - status: observed
    scope: fresh_unsaved_interventional_basic_information_draft
    detail: The DOM-visible styled international-cooperation checkbox pair exposed values true and false but no reliable checked state. One normal click on the true control did not expose a state or structural change in this browser surface.
    consequence: International-cooperation and overseas-recruitment conditions remain pending. This is not evidence for either option and does not modify canonical conditions.
manual_live_observations:
  - provenance: user-assisted observation in the current unsaved test draft
    evidence_grade: current_page_verified
    verification_level: sample_verified
    sample_scope: research-design current-page yes/no comparison, including the visible checklist and inline other-vulnerable-group text field
    page_id: research-design
    control_path: research-design.vulnerable-group
    compared_options:
      'yes':
        visible_field_paths:
          - research-design.vulnerable-group-type
          - research-design.vulnerable-group-other
        visible_option_labels:
          - 儿童
          - 孕期/哺乳期妇女
          - 残障人士
          - 其他弱势人群
      'no':
        hidden_field_paths:
          - research-design.vulnerable-group-type
          - research-design.vulnerable-group-other
    current_page_comparison: Yes displayed the four-option multi-select checklist and its inline other-vulnerable-group text field; no hid the entire local block. User reports all other current-page fields unchanged.
    boundary: This confirms only the current-page branch. Later pages remain unverified until a representative path is replayed to its last reachable page.
  - provenance: user-assisted observation in the current unsaved test draft
