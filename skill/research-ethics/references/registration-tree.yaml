schema_version: '0.3'
status: observational_v1_live_verification_in_progress
version_scope:
  version: v1
  supported_root_routes:
  - investigator-observational
  deferred_root_routes:
  - route_id: investigator-interventional
    status: deferred_to_v2
  - route_id: product-drug
    status: deferred_to_v2
  - route_id: product-medical-device
    status: deferred_to_v2
  - route_id: product-ivd
    status: deferred_to_v2
  - route_id: product-special-food
    status: deferred_to_v2
  deferred_to_v2_expansions:
  - route_id: product-drug
    label: 以产品注册为目的的临床试验 > 药品
    status: deferred_to_v2
  - route_id: product-medical-device-class-i
    label: 以产品注册为目的的临床试验 > 医疗器械 I 类
    status: deferred_to_v2
  - route_id: product-medical-device-class-ii
    label: 以产品注册为目的的临床试验 > 医疗器械 II 类
    status: deferred_to_v2
  - route_id: product-medical-device-class-iii
    label: 以产品注册为目的的临床试验 > 医疗器械 III 类
    status: deferred_to_v2
  - route_id: product-ivd-class-i
    label: 以产品注册为目的的临床试验 > 体外诊断试剂 I 类
    status: deferred_to_v2
  - route_id: product-ivd-class-ii
    label: 以产品注册为目的的临床试验 > 体外诊断试剂 II 类
    status: deferred_to_v2
  - route_id: product-ivd-class-iii
    label: 以产品注册为目的的临床试验 > 体外诊断试剂 III 类
    status: deferred_to_v2
  - route_id: product-special-food
    label: 以产品注册为目的的临床试验 > 特殊医学用途配方食品
    status: deferred_to_v2
  v1_rule_boundary: Only the researcher-initiated observational route may become live-verified or appear expanded in the observational-v1
    final tree. Investigator-interventional and all product-registration routes are deferred_to_v2.
  verification_policy:
    name: initial-tree_with_stratified-sampling_and_local-dfs-on-mismatch
    initial_tree_rule: The canonical initial tree is the full structural hypothesis and remains visibly distinct from field
      evidence.
    sampling_rule: Each primary root route, each page, and both values of every high-risk dynamic branch receive representative
      live checks before V1 is called sample-verified.
    escalation_rule: A sampled mismatch changes the affected branch to mismatch_found and triggers complete DFS only below
      that branch; unrelated branches retain their own evidence status.
    downstream_rule: Sampled consistency permits a final unmerged display to copy the same downstream structure below each
      upstream branch, while retaining the sampled verification level.
    locality_assumption:
      statement: 除研究分类、诊断试验、公开策略、页面跳过、已发现不一致和其他声明为高风险的条件外，普通动态控件暂视为只改变所在页面，直至出现相反的现场证据。
      application: 记录真实当前页差异；在每条展示分支下机械复制适用的后续模板，并标记 verification_level 为 assumption_expanded。
      exceptions: 研究分类、诊断试验、公开策略、中英文配对、招募/数据/附件风险条件，以及任何抽样不一致，均必须完成代表性后续抽查或局部 DFS。
      provisional_local_controls:
      - research-category.tcm-guided
      - research-category.invasive-bci
      - implementation-information.multicenter-deep-conditions
      - research-design.vulnerable-group-types
      - repeat-group-normal-instance-count
      limitation: 这是 V1.0 建模假设，不代表每一种选项组合都已经完成现场全路径重放。
    display_rule: Final display remains an unmerged tree. Copied structure never creates a rejoining edge.
    prohibited_inference: A current-page observation alone never proves that later pages are identical.
    verification_levels:
      fully_live_verified: Complete live replay from its applicable root to the last reachable page.
      sample_verified: Representative live sampling was consistent within the declared sample scope; scope and pages must
        be recorded.
      assumption_expanded: A current-page difference is recorded and later display structure is mechanically copied under
        the declared V1.0 locality assumption.
      inferred_from_initial_tree: Present only in the canonical initial tree and not yet sampled in V1.
      mismatch_found: A live sample differs from the initial tree; perform local DFS below this branch.
      out_of_scope_or_blocked: A known branch cannot be completed in the current authorization or runtime environment; it
        must not be generated as supported V1 content.
      deferred_to_v2: Product-registration route intentionally excluded from V1 live work.
  live_sampling_revisions:
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test yes / exempt-consent yes-no
    status: sample_verified
    current_page_effect: local_fields_changed
    downstream_effect: not_checked
    scope: fresh unfilled draft, research-design current-page controlled comparison
    finding: exemptConsent=no displayed firstSubjectsExpectedDate; exemptConsent=yes hid it.
    consequence: Keep the date as a local diagnostic-yes design branch. Its later-page equivalence remains unproven.
    evidence_handling: deidentified field-path and checked-state facts only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test no / control-group yes-no
    status: sample_verified
    current_page_effect: none
    downstream_effect: not_checked
    scope: fresh unfilled draft, research-design current-page controlled comparison
    finding: controlGroupFlag=yes and no exposed the same observed ordinary-group field signature.
    consequence: Do not create a current-page structural split; retain downstream comparison as pending.
    evidence_handling: deidentified field-path and checked-state facts only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test no / joint-measures yes-no
    status: sample_verified
    current_page_effect: none
    downstream_effect: not_checked
    scope: fresh unfilled draft, research-design current-page controlled comparison
    finding: jointMeasures=yes and no exposed the same observed ordinary-group field signature.
    consequence: Do not create a current-page structural split; retain downstream comparison as pending.
    evidence_handling: deidentified field-path and checked-state facts only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-interventional / ordinary product attribute / random-group yes-no
    status: mismatch_found
    scope: research-design current-page controlled comparison only
    finding: The current unsaved ordinary-interventional form showed randomMethodDesc only when randomGroup=yes and hid it
      when randomGroup=no. It did not show the canonical random-group-method selector, blinding, allocation-concealment, or
      unblinding controls in this sampled state.
    consequence: Do not treat the legacy random-group-method and blinding subtree as supported for the ordinary-interventional
      route until local DFS determines its actual condition.
    evidence_handling: deidentified field-name and visibility signature only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-interventional / ordinary product attribute / sample-collection yes-no
    status: sample_verified
    scope: research-design current-page controlled comparison only
    finding: sampleCollection=yes displayed the repeatable sample template with sample.name and sample.description; sampleCollection=no
      hid that template.
    evidence_handling: deidentified field-name and visibility signature only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test yes and no
    status: sample_verified
    scope: research-design matched lower viewport in separate fresh unsaved root-path replays
    finding: Diagnostic=yes displayed diagnostic.standard, diagnostic.indexTest, diagnostic.targetCondition, diagnostic.tsampleSize,
      and diagnostic.difficultCondition. Diagnostic=no instead displayed the ordinary repeatable intervention group fields
      including groupName, sampleSize, controlGroupFlag, name, jointMeasures, and description.
    consequence: Diagnostic yes and no remain distinct observational structural routes.
    evidence_handling: deidentified field-name and visibility signature only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test yes / exempt-consent yes-no
    status: sample_verified
    scope: research-design current-page controlled comparison
    finding: exemptConsent=no displayed firstSubjectsExpectedDate; exemptConsent=yes did not display it in the matched viewport.
    evidence_handling: deidentified field-name and visibility signature only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test no / ordinary-group options
    status: sample_verified
    scope: research-design current-page controlled comparisons
    finding: Both values of intervention.controlGroupFlag had the same current-page field signature. Both values of intervention.jointMeasures
      had the same current-page field signature.
    consequence: These two selections differ in user-entered values but do not form a current-page structural branch.
    evidence_handling: deidentified field-name and visibility signature only; no values, source, screenshot, or account data
      retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test yes / public-strategy two-platform-private versus ChiCTR-public
    status: sample_verified
    current_page_effect: local_fields_changed
    downstream_effect: confirmed_cross_page
    scope: fresh unfilled draft; normal UI selection; direct-tab representative comparison of basic-information, data-sharing-and-public-disclosure,
      and related-attachments.
    finding: ChiCTR-public displayed registrationStatus plus English title, acronym, and public-title fields in basic-information.
      The later direct-tab pass also verified English pairs in implementation-information, research-content and research-design.
      In ChiCTR-public, both dataShareStatement=share and dataShareStatement=do-not-share retained the data-share-plan, English
      data-share-plan, data-acquisition-condition, data-url, data-analysis and English data-analysis controls; statistical-result-public
      and release-method remained visible too. In two-platform-private, do-not-share hid the Chinese data-sharing detail group
      while retaining the result-publication group. Both sampled attachment pages showed the same visible attachment categories.
    consequence: public strategy is a confirmed cross-page structural branch. Preserve separate unmerged subtrees for the
      two available public states; do not apply the V1 local-only assumption to this control.
    evidence_handling: deidentified technical field names, option labels, and visible structural facts only; no values, raw
      markup, screenshots, account data, or attachments retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test no / cross-sectional design / data-share-statement yes-no
    status: sample_verified
    current_page_effect: local_fields_changed
    downstream_effect: not_checked
    scope: fresh unfilled draft; normal UI current-page controlled comparison.
    finding: dataShareStatement=yes displayed dataSharePlan, dataAcquisitionCondition, dataUrl, and dataAnalysis. dataShareStatement=no
      hid that observed field group. The statistical-result and release-method group remained visible in both sampled states.
    consequence: Keep a local data-sharing statement branch in the V1 display. Do not infer downstream equivalence from this
      current-page comparison.
    evidence_handling: deidentified technical field names and visible structural facts only; no values, raw markup, screenshots,
      account data, or attachments retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test no / cross-sectional design / statistical-result-public yes-no
    status: sample_verified
    current_page_effect: none
    downstream_effect: not_checked
    scope: fresh unfilled draft; normal UI current-page controlled comparison.
    finding: Both statisticalResultPublic values exposed the same observed releaseMethod and releaseMethodOther current-page
      signature.
    consequence: Do not create a current-page structural split for this control. Its later-page equivalence remains unproven;
      the release-method other sub-option remains out of scope.
    evidence_handling: deidentified technical field names and visible structural facts only; no values, raw markup, screenshots,
      account data, or attachments retained.
  - date: '2026-08-05'
    route: investigator-observational / diagnostic-test yes and no / initial-tab-set and research-design entry
    status: sample_verified
    current_page_effect: page_or_structure_changed
    downstream_effect: not_checked
    scope: fresh unfilled root-path replays; normal UI classification selection and direct-tab comparison.
    finding: Both initial unfilled diagnostic states exposed tabs 0, 1, 2, 3, 4, 6, 7, and 8, with no recruitment tab 5. Diagnostic=no
      exposed an observational study-design-type selector; diagnostic=yes instead entered the diagnostic design template and
      exposed the participant-sex selector in the compared viewport.
    consequence: Keep diagnostic yes and no as separate structural routes. Treat recruitment-tab absence as an initial-unfilled-state
      observation only; its appearance condition still requires a forward representative replay.
    evidence_handling: deidentified page identifiers, option labels, and visible structural facts only; no values, raw markup,
      screenshots, account data, or attachments retained.
atomicity_standard:
  scope: tab0至tab8中用于登记内容的真实数据控件；导航、保存、提交、完成及长字典普通叶值不计入。
  control_rule: 一个平台数据控件对应一个 kind=control 节点；中英文输入框、日期范围两端和重复组子字段均不得合并。
  group_rule: kind=group 只能组织 children；不得用自然语言字符串列表代替真实控件。
  action_rule: 增加、删除、打开选择器等结构操作使用 kind=action；不作为可复制填写内容。
  required_control_metadata:
  - id
  - label
  - technical_name
  - widget
  - order
  - required
  - visible_if
  - value_source
  completion_rule: 每个结构场景的实时有序可见控件签名必须与按条件求值后的 YAML 原子控件签名完全一致，且结构分支覆盖队列为空。
system:
  name: 国家医学研究登记备案信息系统
  workflow: 涉人生命科学和医学研究 > 医学研究
  integration_note: 已验证未保存草稿中选择中国临床试验注册中心公开后出现的中英文配对字段；保存、提交、平台审核和注册号生成流程不在本轮授权范围内。
evidence_policy:
  retain_raw_evidence_in_runtime_skill: false
  accepted_sources:
  - 用户提供的已脱敏截图
  - 用户提供的已脱敏页面源码
  - 当前已登录平台中的未保存测试草稿；仅提炼可见结构，不保留原始证据
  observation_date: '2026-08-04'
workflow:
  id: medical-research-registration
  label: 新建医学研究
  active_route: none; all reachable root routes collected
  active_basic_information_route: both selectable disclosure routes collected; disabled route recorded
  pages:
  - id: research-category
    label: 研究类别
    order: 0
    kind: page
    source_classification: static_template
    nodes:
    - kind: control
      id: implementing-organization
      label: 研究实施单位
      technical_name: organizationId
      widget: select
      order: 0
      required: true
      visible_if: true
      value_source: 账户预填 + 用户核对
      source_classification: code_and_existing_yaml
      verification_level: sample_verified
      default_source: 登录账号所属机构自动带入
      user_confirmation: 如拟申报的研究实施单位与账号默认值不一致，需由用户确认后选择。
      branch_effect: none
      privacy_rule: 规则文件仅记录账户自动带入机制，不记录任何具体机构名称或内部标识。
      path: research-category.implementing-organization
    - kind: group
      id: research-classification
      label: 研究分类
      technical_name: null
      widget: cascading-select-group
      order: 1
      required: true
      visible_if: true
      source_classification: code_and_existing_yaml
      structure_role: root_cascading_branch
      current_confirmed_depth: 2
      future_extension_rule: 如平台在特定第二层选项下显示第三层或更深层分类，则在该选项下追加独立子节点；不得把该层假设为所有路线共有。
      display_rule: 第一层与第二层均为单选；分类分支一旦形成，最终纵向树中后续路线永久独立、不再汇合。
      children:
      - kind: control
        id: research-classification-level-1
        label: 研究分类（一级）
        technical_name: type1
        widget: select
        order: 0
        required: true
        visible_if: true
        options:
        - 以产品注册为目的的临床试验
        - 研究者发起的临床研究
        value_source: 研究计划书 + 用户确认
        source_classification: code_and_existing_yaml
        path: research-category.research-classification-level-1
      - kind: control
        id: research-classification-level-2
        label: 研究分类（二级）
        technical_name: type2
        widget: dependent-select
        order: 1
        required: true
        required_if: 下拉框加载出一个以上选项
        visible_if: true
        options_by_parent:
          以产品注册为目的的临床试验:
          - 药品
          - 医疗器械
          - 体外诊断试剂
          - 特殊医学用途配方食品
          研究者发起的临床研究:
          - 干预性研究
          - 观察性研究
        value_source: 研究计划书 + 用户确认
        source_classification: code_and_existing_yaml
        path: research-category.research-classification-level-2
      - kind: control
        id: research-classification-level-3
        label: 研究分类（三级）
        technical_name: type3
        widget: dependent-select
        order: 2
        required:
          control: research-category.route-leaf
          in:
          - product-medical-device
          - product-ivd
        visible_if:
          control: research-category.route-leaf
          in:
          - product-medical-device
          - product-ivd
        options:
        - I类
        - II类
        - III类
        value_source: 产品分类资料 + 用户确认
        source_classification: code_and_existing_yaml
        path: research-category.research-classification-level-3
      path: research-category.research-classification
    - kind: control
      id: diagnostic-test-classification
      label: 是否是诊断试验
      technical_name: diagnosticTest
      widget: radio
      order: 2
      required: true
      visible_if:
        control: research-category.route-leaf
        equals: investigator-observational
      options:
      - id: 'yes'
        label: 是
      - id: 'no'
        label: 否
      value_source: 研究计划书 + 用户确认
      source_classification: existing_yaml_live_verified
      path: research-category.diagnostic-trial
    - kind: group
      id: nmpa-information
      label: NMPA信息
      technical_name: null
      widget: conditional-group
      order: 3
      required: false
      required_if: 药品，或医疗器械II/III类；医疗器械I类及体外诊断试剂I/II/III类当前无必填星
      visible_if:
        control: research-category.route-leaf
        in:
        - product-drug
        - product-medical-device
        - product-ivd
      source_classification: code_and_existing_yaml
      children:
      - kind: control
        id: nmpa-number
        label: NMPA批准文号、临床试验申请受理码或医疗器械临床试验备案号
        technical_name: nmpaNumber
        widget: text
        order: 0
        required:
          control: research-category.route-leaf
          in:
          - product-drug
          - product-medical-device
          - product-ivd
        visible_if: true
        value_source: NMPA批准/受理/备案资料
        source_classification: code_and_existing_yaml
        path: research-category.nmpa-number
      - kind: control
        id: nmpa-date
        label: NMPA批准日期或医疗器械临床试验备案时间
        technical_name: nmpaDate
        widget: date
        order: 1
        required:
          control: research-category.route-leaf
          in:
          - product-drug
          - product-medical-device
          - product-ivd
        visible_if: true
        value_source: NMPA批准/备案资料
        source_classification: code_and_existing_yaml
        path: research-category.nmpa-date
      - kind: control
        id: nmpa-document
        label: NMPA批准附件或医疗器械临床试验备案表
        technical_name: nmpaDocument
        widget: pdf-upload
        order: 2
        required:
          control: research-category.route-leaf
          in:
          - product-drug
          - product-medical-device
          - product-ivd
        visible_if: true
        value_source: NMPA批准附件/备案表
        source_classification: code_and_existing_yaml
        path: research-category.nmpa-document
      requiredness_note: NMPA requiredness differs by product/class and is retained for later class-level repair
      path: research-category.nmpa-information
    - kind: control
      id: iit-product-attribute
      label: 是否为生物医学新技术临床研究或涉及未上市产品
      technical_name: productInfoType
      widget: radio
      order: 4
      required: true
      visible_if:
        control: research-category.route-leaf
        equals: investigator-interventional
      options:
      - id: biomedical
        label: 生物医学新技术临床研究
      - id: unproduct
        label: 涉及未上市的药品、疫苗、医疗器械等产品
      - id: none
        label: 否
      value_source: 研究计划书 + 用户确认
      source_classification: code_and_existing_yaml
      path: research-category.iit-product-attribute
    - kind: control
      id: gcp-cell-product-attribute
      label: 是否为干细胞、体细胞临床试验
      technical_name: productInfoType
      widget: radio
      order: 5
      required: true
      visible_if:
        control: research-category.route-leaf
        in:
        - product-drug
        - product-medical-device
      options:
      - id: stem
        label: 干细胞临床试验
      - id: somatic
        label: 体细胞临床试验
      - id: none
        label: 否
      value_source: 研究计划书 + 用户确认
      source_classification: code_and_existing_yaml
      path: research-category.gcp-cell-product-attribute
    - kind: group
      id: unmarketed-product-repeat
      label: 未上市产品信息
      technical_name: unproduct
      widget: repeatable-group
      order: 6
      required:
        all:
        - control: research-category.route-leaf
          equals: investigator-interventional
        - control: research-category.iit-product-attribute
          equals: unproduct
      visible_if:
        all:
        - control: research-category.route-leaf
          equals: investigator-interventional
        - control: research-category.iit-product-attribute
          equals: unproduct
      repeatable: true
      source_classification: code_and_existing_yaml
      children:
      - kind: control
        id: unmarketed-product-type
        label: 未上市产品类型
        technical_name: unproduct.productType
        widget: dictionary-select
        order: 0
        required: true
        visible_if: true
        options:
        - 药品
        - 医疗器械
        - 其他
        value_source: 研究计划书 + 产品资料
        source_classification: code_and_existing_yaml
        path: research-category.unmarketed-product-type
      - kind: control
        id: unmarketed-product-id
        label: 未上市产品内部ID
        technical_name: unproduct.id
        widget: hidden
        order: 1
        required: false
        visible_if: false
        value_source: 系统生成
        user_copyable: false
        source_classification: internal_system_field
        path: research-category.unmarketed-product-id
      - kind: control
        id: unmarketed-product-type-other
        label: 请注明其他产品类型
        technical_name: unproduct.productTypeOther
        widget: text
        order: 2
        required: true
        visible_if:
          control: research-category.unmarketed-product-type
          equals: 其他
        value_source: 研究计划书 + 用户确认
        source_classification: code_and_existing_yaml
        path: research-category.unmarketed-product-type-other
      - kind: control
        id: unmarketed-product-name
        label: 未上市产品名称
        technical_name: unproduct.productName
